name: GusTailAudit
settings:
  CODE_SIGNING_ALLOWED: NO
  SWIFT_VERSION: '5.0'
targets:
  VisionAudit:
    type: bundle.ui-testing
    platform: visionOS
    deploymentTarget: '26.0'
    sources: [TailTests]
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: dev.ericslutz.gusaudit.visionaudit
  MacAudit:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: '26.0'
    sources: [TailTests]
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: dev.ericslutz.gusaudit.macaudit
  WatchAudit:
    type: bundle.ui-testing
    platform: watchOS
    deploymentTarget: '26.0'
    sources: [TailTests]
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: dev.ericslutz.gusaudit.watchaudit
schemes:
  VisionAudit:
    build:
      targets:
        VisionAudit: all
    test:
      targets: [VisionAudit]
  MacAudit:
    build:
      targets:
        MacAudit: all
    test:
      targets: [MacAudit]
  WatchAudit:
    build:
      targets:
        WatchAudit: all
    test:
      targets: [WatchAudit]
