name: GusTVRuntimeAudit
targets:
  TVInspect:
    type: bundle.ui-testing
    platform: tvOS
    deploymentTarget: '27.0'
    sources: [TVRuntimeAcceptance.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ericslutz.gus.runtimeaudit.tv
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  TVInspect:
    build:
      targets:
        TVInspect: all
    test:
      targets: [TVInspect]
