name: GusVisionCapture
options:
  deploymentTarget:
    visionOS: '2.0'
targets:
  GusVisionCaptureUITests:
    type: bundle.ui-testing
    platform: visionOS
    sources: [Tests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ericslutz.gus.validation.visioncapture
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        SWIFT_STRICT_CONCURRENCY: complete
schemes:
  GusVisionCapture:
    build:
      targets:
        GusVisionCaptureUITests: all
    test:
      targets: [GusVisionCaptureUITests]
