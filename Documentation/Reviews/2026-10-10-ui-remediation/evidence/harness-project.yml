name: GusAudit
options:
  deploymentTarget:
    iOS: '18.0'
targets:
  GusAuditTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ericslutz.gus.audit
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
  TVRemediationTests:
    type: bundle.ui-testing
    platform: tvOS
    deploymentTarget: '18.0'
    sources: [TVTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ericslutz.gus.audit.tv
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
  WatchRemediationTests:
    type: bundle.ui-testing
    platform: watchOS
    deploymentTarget: '11.0'
    sources: [WatchTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ericslutz.gus.audit.watch
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  GusAudit:
    build:
      targets:
        GusAuditTests: all
    test:
      targets: [GusAuditTests]

  TVRemediation:
    build:
      targets:
        TVRemediationTests: all
    test:
      targets: [TVRemediationTests]

  WatchRemediation:
    build:
      targets:
        WatchRemediationTests: all
    test:
      targets: [WatchRemediationTests]
