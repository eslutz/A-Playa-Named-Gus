name: Archive Release

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Space-separated platforms to archive: ios tvos visionos macos"
        required: false
        default: "ios tvos visionos macos"

env:
  XCODE_APP: /Applications/Xcode_26.5.app

jobs:
  archive:
    name: Signed Archives
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode 26.5
        run: |
          set -euo pipefail
          if [ ! -d "$XCODE_APP" ]; then
            echo "Required Xcode not found at $XCODE_APP"
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Install build tools
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Import Apple Distribution certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CERTIFICATE_BASE64}" ] || [ -z "${CERTIFICATE_PASSWORD}" ]; then
            echo "APPLE_DISTRIBUTION_CERTIFICATE_BASE64 and APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD are required."
            exit 1
          fi

          keychain_password="$(uuidgen)"
          keychain_path="$RUNNER_TEMP/gus-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/apple-distribution.p12"

          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$keychain_path" "$HOME/Library/Keychains/login.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"

      - name: Install provisioning profiles
        id: profiles
        env:
          IOS_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_IOS_BASE64 }}
          TVOS_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_TVOS_BASE64 }}
          TOPSHELF_TVOS_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_TOPSHELF_TVOS_BASE64 }}
          VISIONOS_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_VISIONOS_BASE64 }}
          MACOS_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_MACOS_BASE64 }}
        run: |
          set -euo pipefail
          profiles_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles_dir"

          install_profile() {
            local label="$1"
            local output_name="$2"
            local base64_value="$3"
            if [ -z "$base64_value" ]; then
              echo "$label provisioning profile secret is required."
              exit 1
            fi

            local profile_path="$RUNNER_TEMP/$label.mobileprovision"
            local plist_path="$RUNNER_TEMP/$label.plist"
            printf '%s' "$base64_value" | base64 --decode > "$profile_path"
            security cms -D -i "$profile_path" > "$plist_path"

            local uuid
            local name
            uuid="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$plist_path")"
            name="$(/usr/libexec/PlistBuddy -c 'Print Name' "$plist_path")"
            cp "$profile_path" "$profiles_dir/$uuid.mobileprovision"
            echo "$output_name=$name" >> "$GITHUB_OUTPUT"
          }

          install_profile ios ios_profile "$IOS_PROFILE_BASE64"
          install_profile tvos tvos_profile "$TVOS_PROFILE_BASE64"
          install_profile topshelf-tvos topshelf_tvos_profile "$TOPSHELF_TVOS_PROFILE_BASE64"
          install_profile visionos visionos_profile "$VISIONOS_PROFILE_BASE64"
          install_profile macos macos_profile "$MACOS_PROFILE_BASE64"

      - name: Write CI signing override
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM_ID }}
          IOS_PROFILE: ${{ steps.profiles.outputs.ios_profile }}
          TVOS_PROFILE: ${{ steps.profiles.outputs.tvos_profile }}
          TOPSHELF_TVOS_PROFILE: ${{ steps.profiles.outputs.topshelf_tvos_profile }}
          VISIONOS_PROFILE: ${{ steps.profiles.outputs.visionos_profile }}
          MACOS_PROFILE: ${{ steps.profiles.outputs.macos_profile }}
        run: |
          set -euo pipefail
          if [ -z "${DEVELOPMENT_TEAM}" ]; then
            echo "APPLE_DEVELOPMENT_TEAM_ID is required."
            exit 1
          fi

          cat > Config/Local.xcconfig <<EOF
          DEVELOPMENT_TEAM = ${DEVELOPMENT_TEAM}
          CODE_SIGN_STYLE = Manual
          CODE_SIGN_IDENTITY = Apple Distribution
          CODE_SIGNING_REQUIRED = YES
          CODE_SIGNING_ALLOWED = YES
          GUS_IOS_PROVISIONING_PROFILE_SPECIFIER = ${IOS_PROFILE}
          GUS_TVOS_PROVISIONING_PROFILE_SPECIFIER = ${TVOS_PROFILE}
          GUS_TOPSHELF_TVOS_PROVISIONING_PROFILE_SPECIFIER = ${TOPSHELF_TVOS_PROFILE}
          GUS_VISIONOS_PROVISIONING_PROFILE_SPECIFIER = ${VISIONOS_PROFILE}
          GUS_MACOS_PROVISIONING_PROFILE_SPECIFIER = ${MACOS_PROFILE}
          EOF

      - name: Archive selected platforms
        run: |
          set -euo pipefail
          read -r -a platforms <<< "${{ inputs.platforms }}"
          Scripts/archive-release.sh "${platforms[@]}"

      - name: Upload archives
        uses: actions/upload-artifact@v4
        with:
          name: gus-xcarchives
          path: build/archives/*.xcarchive
          if-no-files-found: error
          retention-days: 14
