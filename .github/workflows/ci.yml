name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install lint tools
        run: brew install jq swiftformat

      - name: SwiftFormat lint
        run: swiftformat Sources Tests --lint

      - name: Validate String Catalog
        run: jq empty Resources/Localizable.xcstrings

  build:
    name: Build ${{ matrix.name }}
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            destination: generic/platform=iOS Simulator
          - name: macOS
            destination: platform=macOS
          - name: tvOS
            destination: generic/platform=tvOS Simulator
          - name: visionOS
            destination: generic/platform=visionOS Simulator

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select latest installed Xcode
        run: |
          set -euo pipefail
          latest_xcode="$(find /Applications -maxdepth 1 -name 'Xcode*.app' -print | sort | tail -1)"
          if [ -z "$latest_xcode" ]; then
            echo "No Xcode installation found under /Applications"
            exit 1
          fi
          sudo xcode-select -s "$latest_xcode/Contents/Developer"
          xcodebuild -version

      - name: Install build tools
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project 'A Playa Named Gus.xcodeproj' -scheme 'A Playa Named Gus'

      - name: Build ${{ matrix.name }}
        run: xcodebuild -project 'A Playa Named Gus.xcodeproj' -scheme 'A Playa Named Gus' -destination '${{ matrix.destination }}' build

  test-ios:
    name: Test iOS
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select latest installed Xcode
        run: |
          set -euo pipefail
          latest_xcode="$(find /Applications -maxdepth 1 -name 'Xcode*.app' -print | sort | tail -1)"
          if [ -z "$latest_xcode" ]; then
            echo "No Xcode installation found under /Applications"
            exit 1
          fi
          sudo xcode-select -s "$latest_xcode/Contents/Developer"
          xcodebuild -version

      - name: Install build tools
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project 'A Playa Named Gus.xcodeproj' -scheme 'A Playa Named Gus'

      - name: Pick iOS simulator
        id: ios-sim
        run: |
          set -euo pipefail
          sim_name="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1; exit }')"
          if [ -z "$sim_name" ]; then
            echo "No available iPhone simulator found"
            exit 1
          fi
          echo "destination=platform=iOS Simulator,name=$sim_name" >> "$GITHUB_OUTPUT"

      - name: Test iOS
        run: xcodebuild test -project 'A Playa Named Gus.xcodeproj' -scheme 'A Playa Named Gus' -destination '${{ steps.ios-sim.outputs.destination }}'

  test-macos:
    name: Test macOS Unit
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select latest installed Xcode
        run: |
          set -euo pipefail
          latest_xcode="$(find /Applications -maxdepth 1 -name 'Xcode*.app' -print | sort | tail -1)"
          if [ -z "$latest_xcode" ]; then
            echo "No Xcode installation found under /Applications"
            exit 1
          fi
          sudo xcode-select -s "$latest_xcode/Contents/Developer"
          xcodebuild -version

      - name: Install build tools
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project 'A Playa Named Gus.xcodeproj' -scheme 'Gus Unit Tests'

      - name: Test macOS unit tests
        run: xcodebuild test -project 'A Playa Named Gus.xcodeproj' -scheme 'Gus Unit Tests' -destination 'platform=macOS'
