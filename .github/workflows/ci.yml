name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  XCODE_APP: /Applications/Xcode_27.1.app

jobs:
  lint:
    name: Lint
    runs-on: xcode-27
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install lint tools
        run: |
          set -euo pipefail
          command -v jq >/dev/null || brew install jq
          command -v swiftformat >/dev/null || brew install swiftformat

      - name: SwiftFormat lint
        run: swiftformat Sources Tests --lint

      - name: Validate String Catalog
        run: jq empty Resources/Localizable.xcstrings

  docs:
    name: Docs and Config
    runs-on: xcode-27
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify release tooling offline
        run: |
          python3 Scripts/test-cloud-bootstrap.py
          python3 Scripts/check-app-icons.py
          swift Scripts/app-store-connect.swift self-test

      - name: Validate Markdown encoding
        run: |
          ruby <<'RUBY'
          paths = Dir["Documentation/**/*.md"] + %w[README.md CONTRIBUTING.md]
          paths.each do |path|
            next unless File.file?(path)

            data = File.binread(path)
            text = data.dup.force_encoding("UTF-8")
            abort("#{path}: not valid UTF-8") unless text.valid_encoding?
            abort("#{path}: contains CRLF line endings") if data.include?("\r\n")
          end
          RUBY

      - name: Validate plists and entitlements
        run: |
          plutil -lint \
            Resources/Info.plist \
            Resources/Watch/Info.plist \
            Resources/PrivacyInfo.xcprivacy \
            Sources/TopShelf/Info.plist \
            Config/Gus.entitlements \
            Config/Gus-tvOS.entitlements \
            Config/GusTopShelf.entitlements \
            Config/Gus-CarPlay.entitlements

      - name: Validate pending entitlement policy
        run: |
          ruby <<'RUBY'
          config = File.read("Config/Shared.xcconfig")
          project = File.read("project.yml")
          if config.include?("Gus-CarPlay.entitlements") || project.include?("Gus-CarPlay.entitlements")
            abort("CarPlay entitlements are pending Apple's grant and must stay unwired")
          end
          RUBY

      - name: Validate workflow YAML
        run: |
          ruby <<'RUBY'
          require "yaml"
          Dir[".github/workflows/*.yml"].each { |path| YAML.load_file(path) }
          YAML.load_file("project.yml")
          RUBY

  build:
    name: Build ${{ matrix.name }}
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            destination: platform=iOS Simulator,name=iPhone 17
          - name: iPadOS
            destination: platform=iOS Simulator,name=iPad Pro 11-inch (M5)
          - name: macOS
            destination: platform=macOS
          - name: tvOS
            destination: generic/platform=tvOS Simulator
          - name: visionOS
            destination: generic/platform=visionOS Simulator
          - name: watchOS
            scheme: Gus watchOS
            destination: generic/platform=watchOS Simulator

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode 27.1 and verify iOS SDK
        run: |
          set -euo pipefail
          if [ ! -d "$XCODE_APP" ]; then
            echo "Required Xcode not found at $XCODE_APP"
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          ios_sdk_version="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          if ! printf '%s\n' "$ios_sdk_version" | awk -F. '/^[0-9]+\.[0-9]+(\.[0-9]+)?$/ { ok = ($1 > 27 || ($1 == 27 && $2 >= 1)) } END { exit !ok }'; then
            echo "iOS Simulator SDK $ios_sdk_version is too old; Duo ArrangementView requires 27.1 or later."
            exit 1
          fi

      - name: Install build tools
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Verify shared Xcode project
        run: python3 Scripts/check-cloud-project.py

      - name: Resolve packages
        run: xcodebuild -onlyUsePackageVersionsFromResolvedFile -resolvePackageDependencies -project 'A Playa Named Gus.xcodeproj' -scheme 'A Playa Named Gus'

      - name: Build ${{ matrix.name }}
        run: xcodebuild -project 'A Playa Named Gus.xcodeproj' -scheme '${{ matrix.scheme || 'A Playa Named Gus' }}' -destination '${{ matrix.destination }}' build

  test:
    name: Test ${{ matrix.name }}
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iPhone
            scheme: Gus iOS Unit Tests
            destination: platform=iOS Simulator,name=iPhone 17
          - name: iPad
            scheme: Gus iOS Unit Tests
            destination: platform=iOS Simulator,name=iPad Pro 11-inch (M5)
          - name: tvOS
            scheme: Gus tvOS Unit Tests
            destination: platform=tvOS Simulator,name=Apple TV 4K (3rd generation)
          - name: visionOS
            scheme: Gus visionOS Unit Tests
            destination: ""
          - name: macOS
            scheme: Gus macOS Unit Tests
            destination: platform=macOS

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode 27.1 and verify iOS SDK
        run: |
          set -euo pipefail
          if [ ! -d "$XCODE_APP" ]; then
            echo "Required Xcode not found at $XCODE_APP"
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          ios_sdk_version="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          if ! printf '%s\n' "$ios_sdk_version" | awk -F. '/^[0-9]+\.[0-9]+(\.[0-9]+)?$/ { ok = ($1 > 27 || ($1 == 27 && $2 >= 1)) } END { exit !ok }'; then
            echo "iOS Simulator SDK $ios_sdk_version is too old; Duo ArrangementView requires 27.1 or later."
            exit 1
          fi

      - name: Install build tools
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Verify shared Xcode project
        run: python3 Scripts/check-cloud-project.py

      - name: Prepare Mac unit test signing
        if: matrix.name == 'macOS'
        run: |
          set -euo pipefail
          if [ -e Config/Local.xcconfig ] || [ -L Config/Local.xcconfig ]; then
            echo "Refusing to overwrite an existing local signing configuration."
            exit 1
          fi
          python3 <<'PY'
          import os
          from pathlib import Path
          import plistlib
          entitlements = {
              "com.apple.security.app-sandbox": True,
              "com.apple.security.network.client": True,
              "com.apple.security.network.server": True,
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "gus-macos-unit.entitlements"
          path.write_bytes(plistlib.dumps(entitlements))
          PY
          plutil -lint "$RUNNER_TEMP/gus-macos-unit.entitlements"
          # Restricted production capabilities need provisioned signing; this
          # credential-free unit host keeps the sandbox and networking permissions.
          printf 'CODE_SIGN_ENTITLEMENTS[sdk=macosx*] = %s\n' "$RUNNER_TEMP/gus-macos-unit.entitlements" > Config/Local.xcconfig

      - name: Resolve packages
        run: xcodebuild -onlyUsePackageVersionsFromResolvedFile -resolvePackageDependencies -project 'A Playa Named Gus.xcodeproj' -scheme '${{ matrix.scheme }}'

      - name: Pick visionOS simulator
        id: vision-sim
        if: matrix.name == 'visionOS'
        run: |
          set -euo pipefail
          sim_id="$(
            xcrun simctl list devices available |
              awk -F '[()]' '/Apple Vision Pro/ { id=$2 } END { print id }'
          )"
          if [ -z "$sim_id" ]; then
            echo "No available Apple Vision Pro simulator found"
            exit 1
          fi
          echo "destination=platform=visionOS Simulator,id=$sim_id" >> "$GITHUB_OUTPUT"

      - name: Test ${{ matrix.name }}
        run: |
          set -euo pipefail
          destination='${{ matrix.destination }}'
          if [ '${{ matrix.name }}' = 'visionOS' ]; then
            destination='${{ steps.vision-sim.outputs.destination }}'
          fi
          xcodebuild test -project 'A Playa Named Gus.xcodeproj' -scheme '${{ matrix.scheme }}' -destination "$destination"

      - name: Diagnose Mac unit test launch failure
        if: failure() && matrix.name == 'macOS'
        continue-on-error: true
        run: |
          set -euo pipefail
          for app in "$HOME"/Library/Developer/Xcode/DerivedData/A_Playa_Named_Gus-*/Build/Products/Debug/"A Playa Named Gus.app"; do
            [ -d "$app" ] || continue
            if [ -f "$app/Contents/embedded.provisionprofile" ]; then
              echo "Mac unit host provisioning profile: present"
            else
              echo "Mac unit host provisioning profile: absent"
            fi
            if codesign --verify --strict "$app" >/dev/null 2>&1; then
              echo "Mac unit host signature verification: passed"
            else
              echo "Mac unit host signature verification: failed"
            fi
            codesign --display --verbose=2 "$app" 2>&1 | awk '/^(Signature=|TeamIdentifier=)/' || true
            break
          done
          # Query only this app's signing rejection messages, never the whole log.
          /usr/bin/log show --last 10m --style compact --predicate '(process == "taskgated-helper" OR process == "amfid") AND (eventMessage CONTAINS "dev.ericslutz.gus" OR eventMessage CONTAINS "A Playa Named Gus")' 2>/dev/null |
            sed -E 's#https?://[^[:space:]]+\?[^[:space:]]+#[URL query redacted]#g; s#Bearer[[:space:]]+[^[:space:]]+#Bearer [redacted]#g; s#eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+#[JWT redacted]#g; s#[[:alnum:]_.+-]+@[[:alnum:].-]+#[email redacted]#g' |
            head -n 40 || true
