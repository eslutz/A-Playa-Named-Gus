name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  XCODE_APP: /Applications/Xcode_26.5.app

jobs:
  lint:
    name: Lint
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install lint tools
        run: |
          set -euo pipefail
          command -v jq >/dev/null || brew install jq
          command -v swiftformat >/dev/null || brew install swiftformat

      - name: SwiftFormat lint
        run: swiftformat Sources Tests --lint

      - name: Validate String Catalog
        run: jq empty Resources/Localizable.xcstrings

  docs:
    name: Docs and Config
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Markdown encoding
        run: |
          ruby <<'RUBY'
          paths = Dir["Documentation/**/*.md"] + %w[README.md CONTRIBUTING.md]
          paths.each do |path|
            next unless File.file?(path)

            data = File.binread(path)
            text = data.dup.force_encoding("UTF-8")
            abort("#{path}: not valid UTF-8") unless text.valid_encoding?
            abort("#{path}: contains CRLF line endings") if data.include?("\r\n")
          end
          RUBY

      - name: Validate plists and entitlements
        run: |
          plutil -lint \
            Resources/Info.plist \
            Resources/PrivacyInfo.xcprivacy \
            Sources/TopShelf/Info.plist \
            Config/Gus.entitlements \
            Config/Gus-tvOS.entitlements

      - name: Validate workflow YAML
        run: |
          ruby <<'RUBY'
          require "yaml"
          Dir[".github/workflows/*.yml"].each { |path| YAML.load_file(path) }
          YAML.load_file("project.yml")
          RUBY

  build:
    name: Build ${{ matrix.name }}
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            destination: platform=iOS Simulator,name=iPhone 17
          - name: iPadOS
            destination: platform=iOS Simulator,name=iPad Pro 11-inch (M5)
          - name: macOS
            destination: platform=macOS
          - name: tvOS
            destination: generic/platform=tvOS Simulator
          - name: visionOS
            destination: generic/platform=visionOS Simulator

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode 26.5
        run: |
          set -euo pipefail
          if [ ! -d "$XCODE_APP" ]; then
            echo "Required Xcode not found at $XCODE_APP"
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Install build tools
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project 'A Playa Named Gus.xcodeproj' -scheme 'A Playa Named Gus'

      - name: Build ${{ matrix.name }}
        run: xcodebuild -project 'A Playa Named Gus.xcodeproj' -scheme 'A Playa Named Gus' -destination '${{ matrix.destination }}' build

  test:
    name: Test ${{ matrix.name }}
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iPhone
            scheme: Gus iOS Unit Tests
            destination: platform=iOS Simulator,name=iPhone 17
          - name: iPad
            scheme: Gus iOS Unit Tests
            destination: platform=iOS Simulator,name=iPad Pro 11-inch (M5)
          - name: tvOS
            scheme: Gus tvOS Unit Tests
            destination: platform=tvOS Simulator,name=Apple TV 4K (3rd generation)
          - name: visionOS
            scheme: Gus visionOS Unit Tests
            destination: ""
          - name: macOS
            scheme: Gus macOS Unit Tests
            destination: platform=macOS

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode 26.5
        run: |
          set -euo pipefail
          if [ ! -d "$XCODE_APP" ]; then
            echo "Required Xcode not found at $XCODE_APP"
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Install build tools
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project 'A Playa Named Gus.xcodeproj' -scheme '${{ matrix.scheme }}'

      - name: Pick visionOS simulator
        id: vision-sim
        if: matrix.name == 'visionOS'
        run: |
          set -euo pipefail
          sim_id="$(
            xcrun simctl list devices available |
              awk -F '[()]' '/Apple Vision Pro/ { id=$2 } END { print id }'
          )"
          if [ -z "$sim_id" ]; then
            echo "No available Apple Vision Pro simulator found"
            exit 1
          fi
          echo "destination=platform=visionOS Simulator,id=$sim_id" >> "$GITHUB_OUTPUT"

      - name: Test ${{ matrix.name }}
        run: |
          set -euo pipefail
          destination='${{ matrix.destination }}'
          if [ '${{ matrix.name }}' = 'visionOS' ]; then
            destination='${{ steps.vision-sim.outputs.destination }}'
          fi
          xcodebuild test -project 'A Playa Named Gus.xcodeproj' -scheme '${{ matrix.scheme }}' -destination "$destination"
