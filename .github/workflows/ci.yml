name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  XCODE_APP: /Applications/Xcode_27.2.app

jobs:
  changes:
    name: Validation Scope
    runs-on: xcode-27
    timeout-minutes: 10
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - name: Checkout history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Classify build inputs
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 Scripts/classify-changes.py --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    runs-on: xcode-27
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install lint tools
        run: |
          set -euo pipefail
          command -v jq >/dev/null || brew install jq
          command -v swiftformat >/dev/null || brew install swiftformat

      - name: SwiftFormat lint
        run: swiftformat Sources Tests --lint

      - name: Validate String Catalog
        run: jq empty Resources/Localizable.xcstrings

  docs:
    name: Docs and Config
    runs-on: xcode-27
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify release tooling offline
        run: |
          python3 Scripts/test-cloud-bootstrap.py
          python3 Scripts/test-release-warning-gate.py
          python3 Scripts/test-classify-changes.py
          ruby Scripts/check-hosted-validation.rb
          python3 Scripts/check-app-icons.py
          swift Scripts/app-store-connect.swift self-test

      - name: Validate Markdown encoding
        run: |
          ruby <<'RUBY'
          abort("AGENTS.md must be a regular file") unless File.file?("AGENTS.md") && !File.symlink?("AGENTS.md")
          paths = Dir["Documentation/**/*.md"] + %w[AGENTS.md README.md CONTRIBUTING.md]
          paths.each do |path|
            next unless File.file?(path)

            data = File.binread(path)
            text = data.dup.force_encoding("UTF-8")
            abort("#{path}: not valid UTF-8") unless text.valid_encoding?
            abort("#{path}: contains CRLF line endings") if data.include?("\r\n")
          end
          RUBY

      - name: Validate plists and entitlements
        run: |
          plutil -lint \
            Resources/Info.plist \
            Resources/Watch/Info.plist \
            Resources/PrivacyInfo.xcprivacy \
            Sources/TopShelf/Info.plist \
            Config/Gus.entitlements \
            Config/Gus-tvOS.entitlements \
            Config/GusTopShelf.entitlements \
            Config/Gus-CarPlay.entitlements

      - name: Validate pending entitlement policy
        run: |
          ruby <<'RUBY'
          config = File.read("Config/Shared.xcconfig")
          project = File.read("project.yml")
          if config.include?("Gus-CarPlay.entitlements") || project.include?("Gus-CarPlay.entitlements")
            abort("CarPlay entitlements are pending Apple's grant and must stay unwired")
          end
          RUBY

      - name: Validate workflow YAML
        run: |
          ruby <<'RUBY'
          require "yaml"
          Dir[".github/workflows/*.yml"].each { |path| YAML.load_file(path) }
          YAML.load_file("project.yml")
          RUBY

  build:
    if: ${{ !cancelled() }}
    needs: changes
    name: Build macOS
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - name: Require successful change classification
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Checkout
        uses: actions/checkout@v6

      - name: Documentation-only validation complete
        if: needs.changes.outputs.full != 'true'
        run: echo "Documentation-only change; lightweight validation runs in separate required jobs."

      - name: Select Xcode 27.2 and verify macOS SDK
        if: needs.changes.outputs.full == 'true'
        run: |
          set -euo pipefail
          if [ ! -d "$XCODE_APP" ]; then
            echo "Required Xcode not found at $XCODE_APP"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          macos_sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          if ! printf '%s\n' "$macos_sdk_version" | awk -F. '/^[0-9]+\.[0-9]+(\.[0-9]+)?$/ { ok = ($1 > 27 || ($1 == 27 && $2 >= 2)) } END { exit !ok }'; then
            echo "macOS SDK $macos_sdk_version is too old; CI requires 27.2 or later."
            exit 1
          fi

      - name: Install build tools
        if: needs.changes.outputs.full == 'true'
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Verify shared Xcode project
        if: needs.changes.outputs.full == 'true'
        run: python3 Scripts/check-cloud-project.py

      - name: Resolve packages
        if: needs.changes.outputs.full == 'true'
        run: python3 Scripts/run-warning-free.py --waive-ci-simulator-discovery xcodebuild -onlyUsePackageVersionsFromResolvedFile -resolvePackageDependencies -project 'A Playa Named Gus.xcodeproj' -scheme 'Gus macOS Unit Tests' -destination 'platform=macOS,arch=arm64'

      - name: Build macOS
        if: needs.changes.outputs.full == 'true'
        # Native compile validation does not require production capability profiles.
        run: python3 Scripts/run-warning-free.py --waive-ci-simulator-discovery xcodebuild -project 'A Playa Named Gus.xcodeproj' -scheme 'A Playa Named Gus' -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO build

  test:
    if: ${{ !cancelled() }}
    needs: changes
    name: Test macOS
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Require successful change classification
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Checkout
        uses: actions/checkout@v6

      - name: Documentation-only validation complete
        if: needs.changes.outputs.full != 'true'
        run: echo "Documentation-only change; lightweight validation runs in separate required jobs."

      - name: Select Xcode 27.2 and verify macOS SDK
        if: needs.changes.outputs.full == 'true'
        run: |
          set -euo pipefail
          if [ ! -d "$XCODE_APP" ]; then
            echo "Required Xcode not found at $XCODE_APP"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          macos_sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          if ! printf '%s\n' "$macos_sdk_version" | awk -F. '/^[0-9]+\.[0-9]+(\.[0-9]+)?$/ { ok = ($1 > 27 || ($1 == 27 && $2 >= 2)) } END { exit !ok }'; then
            echo "macOS SDK $macos_sdk_version is too old; CI requires 27.2 or later."
            exit 1
          fi

      - name: Install build tools
        if: needs.changes.outputs.full == 'true'
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Verify shared Xcode project
        if: needs.changes.outputs.full == 'true'
        run: python3 Scripts/check-cloud-project.py

      - name: Prepare Mac unit test signing
        if: needs.changes.outputs.full == 'true'
        run: |
          set -euo pipefail
          if [ -e Config/Local.xcconfig ] || [ -L Config/Local.xcconfig ]; then
            echo "Refusing to overwrite an existing local signing configuration."
            exit 1
          fi
          python3 <<'PY'
          import os
          from pathlib import Path
          import plistlib
          entitlements = {
              "com.apple.security.app-sandbox": True,
              "com.apple.security.network.client": True,
              "com.apple.security.network.server": True,
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "gus-macos-unit.entitlements"
          path.write_bytes(plistlib.dumps(entitlements))
          PY
          plutil -lint "$RUNNER_TEMP/gus-macos-unit.entitlements"
          # Restricted production capabilities need provisioned signing; this
          # credential-free unit host keeps the sandbox and networking permissions.
          printf 'CODE_SIGN_ENTITLEMENTS[sdk=macosx*] = %s\n' "$RUNNER_TEMP/gus-macos-unit.entitlements" > Config/Local.xcconfig

      - name: Resolve packages
        if: needs.changes.outputs.full == 'true'
        run: python3 Scripts/run-warning-free.py --waive-ci-simulator-discovery xcodebuild -onlyUsePackageVersionsFromResolvedFile -resolvePackageDependencies -project 'A Playa Named Gus.xcodeproj' -scheme 'Gus macOS Unit Tests' -destination 'platform=macOS,arch=arm64'

      - name: Test macOS
        if: needs.changes.outputs.full == 'true'
        run: python3 Scripts/run-warning-free.py --waive-ci-simulator-discovery xcodebuild test -project 'A Playa Named Gus.xcodeproj' -scheme 'Gus macOS Unit Tests' -destination 'platform=macOS,arch=arm64'

      - name: Diagnose Mac unit test launch failure
        if: needs.changes.outputs.full == 'true' && failure()
        continue-on-error: true
        run: |
          set -euo pipefail
          for app in "$HOME"/Library/Developer/Xcode/DerivedData/A_Playa_Named_Gus-*/Build/Products/Debug/"A Playa Named Gus.app"; do
            [ -d "$app" ] || continue
            if [ -f "$app/Contents/embedded.provisionprofile" ]; then
              echo "Mac unit host provisioning profile: present"
            else
              echo "Mac unit host provisioning profile: absent"
            fi
            if codesign --verify --strict "$app" >/dev/null 2>&1; then
              echo "Mac unit host signature verification: passed"
            else
              echo "Mac unit host signature verification: failed"
            fi
            codesign --display --verbose=2 "$app" 2>&1 | awk '/^(Signature=|TeamIdentifier=)/' || true
            break
          done
          # Query only this app's signing rejection messages, never the whole log.
          /usr/bin/log show --last 10m --style compact --predicate '(process == "taskgated-helper" OR process == "amfid") AND (eventMessage CONTAINS "dev.ericslutz.gus" OR eventMessage CONTAINS "A Playa Named Gus")' 2>/dev/null |
            sed -E 's#https?://[^[:space:]]+\?[^[:space:]]+#[URL query redacted]#g; s#Bearer[[:space:]]+[^[:space:]]+#Bearer [redacted]#g; s#eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+#[JWT redacted]#g; s#[[:alnum:]_.+-]+@[[:alnum:].-]+#[email redacted]#g' |
            head -n 40 || true
