name: A Playa Named Gus

# ---------------------------------------------------------------------------
# A Playa Named Gus — an Apple-first, multiplatform Jellyfin client.
# Single SwiftUI app target with five Supported Destinations
# (iOS, iPadOS via iOS, tvOS, visionOS, macOS). This file is the source of
# truth; `xcodegen generate` (re)builds A Playa Named Gus.xcodeproj from it.
# ---------------------------------------------------------------------------

options:
  xcodeVersion: "26.5"
  bundleIdPrefix: dev.ericslutz
  deploymentTarget:
    iOS: "18.0"
    tvOS: "18.0"
    visionOS: "2.0"
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

# Build settings live in Config/Shared.xcconfig (the build-settings home).
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

packages:
  JellyfinSDK:
    url: https://github.com/jellyfin/jellyfin-sdk-swift
    from: "2.1.0"

targets:
  Gus:
    type: application
    # Modern Xcode "Supported Destinations" — one target, five platforms.
    supportedDestinations: [iOS, tvOS, visionOS, macOS]
    sources:
      - path: Sources
        excludes:
          - "TopShelf/**"
      - path: Resources
        # Info.plist is referenced via INFOPLIST_FILE, not copied as a resource.
        excludes:
          - "Info.plist"
    dependencies:
      - package: JellyfinSDK
        product: JellyfinAPI
      - target: GusTopShelf
        destinationFilters: [tvOS]
        embed: true
        link: false
        copy:
          destination: plugins
    # The only target-specific settings; everything else is in the xcconfig.
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist

  GusTopShelf:
    type: tv-app-extension
    platform: tvOS
    supportedDestinations: [tvOS]
    sources:
      - path: Sources/TopShelf
        excludes:
          - "Info.plist"
      - path: Resources/Localizable.xcstrings
    settings:
      base:
        INFOPLIST_FILE: Sources/TopShelf/Info.plist
        PRODUCT_NAME: GusTopShelf
        PRODUCT_MODULE_NAME: GusTopShelf
        PRODUCT_BUNDLE_IDENTIFIER: dev.ericslutz.gus.topshelf
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_ENTITLEMENTS: ""

  GusTests:
    type: bundle.unit-test
    platform: iOS
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Tests/APlayaNamedGusTests
    dependencies:
      - target: Gus
    settings:
      base:
        PRODUCT_NAME: GusTests
        PRODUCT_MODULE_NAME: GusTests
        PRODUCT_BUNDLE_IDENTIFIER: dev.ericslutz.gus.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/A Playa Named Gus.app/A Playa Named Gus"
        TEST_HOST[sdk=macosx*]: "$(BUILT_PRODUCTS_DIR)/A Playa Named Gus.app/Contents/MacOS/A Playa Named Gus"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_ENTITLEMENTS: ""
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: ""

  GusUITests:
    type: bundle.ui-testing
    platform: iOS
    supportedDestinations: [iOS]
    sources:
      - path: Tests/APlayaNamedGusUITests
    dependencies:
      - target: Gus
    settings:
      base:
        PRODUCT_NAME: GusUITests
        PRODUCT_MODULE_NAME: GusUITests
        PRODUCT_BUNDLE_IDENTIFIER: dev.ericslutz.gus.uitests
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_ENTITLEMENTS: ""
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: ""

schemes:
  A Playa Named Gus:
    build:
      targets:
        Gus: all
    test:
      gatherCoverageData: true
      targets:
        - GusTests
        - GusUITests

  Gus Unit Tests:
    build:
      targets:
        Gus: all
    test:
      gatherCoverageData: true
      targets:
        - GusTests
