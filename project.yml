name: A Playa Named Gus

# ---------------------------------------------------------------------------
# A Playa Named Gus — an Apple-first, multiplatform Jellyfin client.
# Single SwiftUI app target with five Supported Destinations
# (iOS, iPadOS via iOS, tvOS, visionOS, macOS). This file is the source of
# truth; `xcodegen generate` (re)builds A Playa Named Gus.xcodeproj from it.
# ---------------------------------------------------------------------------

options:
  xcodeVersion: "26.5"
  bundleIdPrefix: dev.ericslutz
  deploymentTarget:
    iOS: "18.0"
    tvOS: "18.0"
    visionOS: "2.0"
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

# Build settings live in Config/Shared.xcconfig (the build-settings home).
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

packages:
  JellyfinSDK:
    url: https://github.com/jellyfin/jellyfin-sdk-swift
    from: "2.1.0"

targets:
  Gus:
    type: application
    # Modern Xcode "Supported Destinations" — one target, five platforms.
    supportedDestinations: [iOS, tvOS, visionOS, macOS]
    sources:
      - path: Sources
        excludes:
          - "TopShelf/**"
      - path: Resources
        # Info.plist is referenced via INFOPLIST_FILE, not copied as a resource.
        excludes:
          - "Info.plist"
    dependencies:
      - sdk: AppIntents.framework
      - package: JellyfinSDK
        product: JellyfinAPI
      - target: GusTopShelf
        destinationFilters: [tvOS]
        embed: true
        link: false
        copy:
          destination: plugins
    # The only target-specific settings; everything else is in the xcconfig.
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]: $(GUS_IOS_PROVISIONING_PROFILE_SPECIFIER)
        PROVISIONING_PROFILE_SPECIFIER[sdk=appletvos*]: $(GUS_TVOS_PROVISIONING_PROFILE_SPECIFIER)
        PROVISIONING_PROFILE_SPECIFIER[sdk=xros*]: $(GUS_VISIONOS_PROVISIONING_PROFILE_SPECIFIER)
        PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]: $(GUS_MACOS_PROVISIONING_PROFILE_SPECIFIER)

  GusTopShelf:
    type: tv-app-extension
    platform: tvOS
    supportedDestinations: [tvOS]
    sources:
      - path: Sources/TopShelf
        excludes:
          - "Info.plist"
      - path: Resources/Localizable.xcstrings
    dependencies:
      - sdk: AppIntents.framework
    settings:
      base:
        INFOPLIST_FILE: Sources/TopShelf/Info.plist
        PRODUCT_NAME: GusTopShelf
        PRODUCT_MODULE_NAME: GusTopShelf
        PRODUCT_BUNDLE_IDENTIFIER: dev.ericslutz.gus.topshelf
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_ENTITLEMENTS: ""
        PROVISIONING_PROFILE_SPECIFIER[sdk=appletvos*]: $(GUS_TOPSHELF_TVOS_PROVISIONING_PROFILE_SPECIFIER)

  GusTests:
    type: bundle.unit-test
    platform: iOS
    supportedDestinations: [iOS]
    sources:
      - path: Tests/APlayaNamedGusTests
    dependencies:
      - sdk: AppIntents.framework
      - target: Gus
    settings:
      base:
        PRODUCT_NAME: GusTests
        PRODUCT_MODULE_NAME: GusTests
        PRODUCT_BUNDLE_IDENTIFIER: dev.ericslutz.gus.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/A Playa Named Gus.app/A Playa Named Gus"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_ENTITLEMENTS: ""

  GusTVOSTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - path: Tests/APlayaNamedGusTests
    dependencies:
      - sdk: AppIntents.framework
      - target: Gus
    settings:
      base:
        PRODUCT_NAME: GusTVOSTests
        PRODUCT_MODULE_NAME: GusTVOSTests
        PRODUCT_BUNDLE_IDENTIFIER: dev.ericslutz.gus.tvos-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/A Playa Named Gus.app/A Playa Named Gus"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_ENTITLEMENTS: ""

  GusVisionOSTests:
    type: bundle.unit-test
    platform: visionOS
    sources:
      - path: Tests/APlayaNamedGusTests
    dependencies:
      - sdk: AppIntents.framework
      - target: Gus
    settings:
      base:
        PRODUCT_NAME: GusVisionOSTests
        PRODUCT_MODULE_NAME: GusVisionOSTests
        PRODUCT_BUNDLE_IDENTIFIER: dev.ericslutz.gus.visionos-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/A Playa Named Gus.app/A Playa Named Gus"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_ENTITLEMENTS: ""

  GusMacOSTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/APlayaNamedGusTests
    dependencies:
      - sdk: AppIntents.framework
      - target: Gus
    settings:
      base:
        PRODUCT_NAME: GusMacOSTests
        PRODUCT_MODULE_NAME: GusMacOSTests
        PRODUCT_BUNDLE_IDENTIFIER: dev.ericslutz.gus.macos-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/A Playa Named Gus.app/Contents/MacOS/A Playa Named Gus"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_ENTITLEMENTS: ""

  GusUITests:
    type: bundle.ui-testing
    platform: iOS
    supportedDestinations: [iOS]
    sources:
      - path: Tests/APlayaNamedGusUITests
    dependencies:
      - sdk: AppIntents.framework
      - target: Gus
    settings:
      base:
        PRODUCT_NAME: GusUITests
        PRODUCT_MODULE_NAME: GusUITests
        PRODUCT_BUNDLE_IDENTIFIER: dev.ericslutz.gus.uitests
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_ENTITLEMENTS: ""
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: ""

  GusTVOSUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: Tests/APlayaNamedGusUITests
    dependencies:
      - sdk: AppIntents.framework
      - target: Gus
    settings:
      base:
        PRODUCT_NAME: GusTVOSUITests
        PRODUCT_MODULE_NAME: GusTVOSUITests
        PRODUCT_BUNDLE_IDENTIFIER: dev.ericslutz.gus.tvos-uitests
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_ENTITLEMENTS: ""

  GusVisionOSUITests:
    type: bundle.ui-testing
    platform: visionOS
    sources:
      - path: Tests/APlayaNamedGusUITests
    dependencies:
      - sdk: AppIntents.framework
      - target: Gus
    settings:
      base:
        PRODUCT_NAME: GusVisionOSUITests
        PRODUCT_MODULE_NAME: GusVisionOSUITests
        PRODUCT_BUNDLE_IDENTIFIER: dev.ericslutz.gus.visionos-uitests
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_ENTITLEMENTS: ""

  GusMacOSUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/APlayaNamedGusUITests
    dependencies:
      - sdk: AppIntents.framework
      - target: Gus
    settings:
      base:
        PRODUCT_NAME: GusMacOSUITests
        PRODUCT_MODULE_NAME: GusMacOSUITests
        PRODUCT_BUNDLE_IDENTIFIER: dev.ericslutz.gus.macos-uitests
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_ENTITLEMENTS: ""

schemes:
  A Playa Named Gus:
    build:
      targets:
        Gus: all
    test:
      gatherCoverageData: true
      targets:
        - GusTests
        - GusUITests

  Gus iOS Tests:
    build:
      targets:
        Gus: all
    test:
      gatherCoverageData: true
      targets:
        - GusTests
        - GusUITests

  Gus iOS Unit Tests:
    build:
      targets:
        Gus: all
    test:
      gatherCoverageData: true
      targets:
        - GusTests

  Gus tvOS Tests:
    build:
      targets:
        Gus: all
    test:
      gatherCoverageData: true
      targets:
        - GusTVOSTests
        - GusTVOSUITests

  Gus tvOS Unit Tests:
    build:
      targets:
        Gus: all
    test:
      gatherCoverageData: true
      targets:
        - GusTVOSTests

  Gus visionOS Tests:
    build:
      targets:
        Gus: all
    test:
      gatherCoverageData: true
      targets:
        - GusVisionOSTests
        - GusVisionOSUITests

  Gus visionOS Unit Tests:
    build:
      targets:
        Gus: all
    test:
      gatherCoverageData: true
      targets:
        - GusVisionOSTests

  Gus macOS Tests:
    build:
      targets:
        Gus: all
    test:
      gatherCoverageData: true
      targets:
        - GusMacOSTests
        - GusMacOSUITests

  Gus macOS Unit Tests:
    build:
      targets:
        Gus: all
    test:
      gatherCoverageData: true
      targets:
        - GusMacOSTests

  Gus Unit Tests:
    build:
      targets:
        Gus: all
    test:
      gatherCoverageData: true
      targets:
        - GusTests
